<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#101b31"/><stop offset=".52" stop-color="#34445a"/><stop offset="1" stop-color="#d18b58"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff8df" stop-opacity="1"/><stop offset=".28" stop-color="#ffe5ad" stop-opacity=".72"/><stop offset="1" stop-color="#f5b76b" stop-opacity="0"/></radialGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a9a91"/><stop offset="1" stop-color="#414958"/></linearGradient>
 <linearGradient id="opening" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9e9"/><stop offset="1" stop-color="#f2b875"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<circle cx="850" cy="275" r="250" fill="url(#glow)" filter="url(#blur)"/>
<path d="M0 430Q180 365 340 425T680 410T1200 385V630H0Z" fill="#18283a"/>
<path d="M0 492Q190 430 370 475T760 455T1200 445V630H0Z" fill="#101c2c"/>
<!-- distant ridge and sunrise -->
<path d="M0 370L180 320 300 365 470 300 610 360 760 310 900 365 1060 305 1200 340V470H0Z" fill="#29384a" opacity=".8"/>
<circle cx="870" cy="330" r="115" fill="#ffe7bd" opacity=".86"/>
<!-- tomb mound -->
<path d="M650 630Q680 410 850 355Q1040 330 1160 475V630Z" fill="#273447"/>
<path d="M730 630Q740 455 850 410Q975 385 1060 500V630Z" fill="#59606a"/>
<!-- tomb entrance, glowing interior -->
<path d="M790 630V505Q790 405 900 405Q1010 405 1010 505V630Z" fill="#0c1726"/>
<path d="M820 630V508Q820 438 900 438Q980 438 980 508V630Z" fill="url(#opening)" opacity=".95"/>
<path d="M845 630V515Q845 465 900 465Q955 465 955 515V630Z" fill="#182536"/>
<path d="M820 630V508Q820 438 900 438Q980 438 980 508" fill="none" stroke="#c9c4b5" stroke-width="18"/>
<!-- rolled stone -->
<ellipse cx="710" cy="565" rx="93" ry="70" fill="#0b1725" opacity=".45"/>
<circle cx="700" cy="520" r="72" fill="url(#stone)" stroke="#c4b49b" stroke-width="5"/>
<path d="M654 492Q690 465 740 489M643 526Q687 505 751 531M668 575Q705 550 745 560" fill="none" stroke="#c9c4b0" stroke-opacity=".38" stroke-width="5"/>
<!-- light rays -->
<path d="M900 430L585 80M900 430L760 40M900 430L1100 110M900 430L1180 280" stroke="#fff1d1" stroke-opacity=".18" stroke-width="18"/>
<!-- left typography panel -->
<rect x="58" y="52" width="590" height="526" rx="8" fill="#0c1728" opacity=".48"/>
<path d="M92 105H155" stroke="#e8bd86" stroke-width="5"/>
<text x="92" y="145" fill="#e8bd86" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">BIBLICAL CHRISTIAN</text>
<text x="88" y="275" fill="#fffaf0" font-family="Georgia,serif" font-size="67" font-weight="bold">Did Jesus</text>
<text x="88" y="352" fill="#fffaf0" font-family="Georgia,serif" font-size="67" font-weight="bold">Really Rise</text>
<text x="88" y="429" fill="#fffaf0" font-family="Georgia,serif" font-size="67" font-weight="bold">from the Dead?</text>
<path d="M92 466H190" stroke="#e8bd86" stroke-width="4"/>
<text x="92" y="510" fill="#e7d9c7" font-family="Arial,sans-serif" font-size="21" letter-spacing="2">THE EMPTY TOMB. THE WITNESSES.</text>
<text x="92" y="541" fill="#e7d9c7" font-family="Arial,sans-serif" font-size="21" letter-spacing="2">THE RISEN CHRIST.</text>
</svg>
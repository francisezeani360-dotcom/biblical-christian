<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2e8d5"/><stop offset="1" stop-color="#d8c6a8"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9e3028"/><stop offset="1" stop-color="#4e171d"/></linearGradient>
 <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24252a"/><stop offset="1" stop-color="#090d13"/></linearGradient>
 <radialGradient id="gold"><stop stop-color="#f5dba3"/><stop offset="1" stop-color="#b77a42"/></radialGradient>
 <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#392b27" opacity=".12"/><circle cx="13" cy="12" r=".8" fill="#392b27" opacity=".1"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#paper)"/>
<rect width="1200" height="630" fill="url(#grain)"/>
<!-- monumental red field, deliberately off-centre -->
<path d="M660 0H1200V630H555Q650 530 692 405Q746 240 660 0Z" fill="url(#red)"/>
<!-- dark circular field: a decisive change of direction -->
<circle cx="850" cy="310" r="218" fill="#17191f" stroke="#d9b77c" stroke-width="3"/>
<circle cx="850" cy="310" r="190" fill="none" stroke="#d9b77c" stroke-opacity=".35" stroke-width="1.5"/>
<!-- engraved concentric directional marks -->
<g stroke="#e9d5ae" stroke-opacity=".28" fill="none">
 <circle cx="850" cy="310" r="155" stroke-dasharray="2 9"/>
 <path d="M850 95V525M635 310H1065" stroke-dasharray="3 12"/>
</g>
<!-- a broken, discarded crown: symbolic pride laid down -->
<g transform="translate(850 314) rotate(-13)">
 <ellipse cx="0" cy="90" rx="128" ry="24" fill="#000" opacity=".35" filter="url(#shadow)"/>
 <path d="M-112 38L-132 -47 -63 2 -18 -93 25 2 93 -51 111 39Z" fill="#b67a40" stroke="#f2d39c" stroke-width="5"/>
 <path d="M-112 38L111 39 98 78 -98 78Z" fill="#74432f" stroke="#e7c28b" stroke-width="4"/>
 <path d="M-132 -47L-98 78M-18 -93L0 78M93 -51L98 78" stroke="#f5dba3" stroke-width="3" opacity=".65"/>
 <path d="M-18 -93L-5 -28 25 2" fill="none" stroke="#3c2023" stroke-width="9"/>
 <path d="M-5 -28L-32 15" stroke="#3c2023" stroke-width="8"/>
</g>
<!-- clean ivory shaft of light as a graphic plane, not beams -->
<path d="M1025 0H1200V630H1002Q1085 470 1070 320Q1058 166 1025 0Z" fill="#f0d8a9" opacity=".95"/>
<path d="M1098 0H1200V630H1082Q1144 468 1133 315Q1122 158 1098 0Z" fill="#fff2d7" opacity=".72"/>
<!-- tiny cross-like intersection, understated -->
<path d="M1117 260V362M1066 311H1168" stroke="#8b382d" stroke-width="5" opacity=".85"/>
<!-- typography, editorial print layout -->
<text x="78" y="82" fill="#8b382d" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="5">BIBLICAL CHRISTIAN  /  A BIBLICAL STUDY</text>
<path d="M78 112H430" stroke="#8b382d" stroke-width="2"/>
<text x="72" y="255" fill="#202126" font-family="Georgia,serif" font-size="87" font-weight="bold" letter-spacing="-3">What Is</text>
<text x="72" y="350" fill="#202126" font-family="Georgia,serif" font-size="87" font-weight="bold" letter-spacing="-4">Repentance?</text>
<text x="80" y="410" fill="#8b382d" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">A CHANGE OF HEART.</text>
<text x="80" y="442" fill="#8b382d" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">A TURNING OF THE LIFE.</text>
<path d="M80 495H160" stroke="#202126" stroke-width="4"/>
<text x="80" y="540" fill="#55504a" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">FROM SIN — TO GOD.</text>
<text x="80" y="585" fill="#8b382d" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">TRUTH THAT REORDERS EVERYTHING</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171d31"/><stop offset=".58" stop-color="#4a3540"/><stop offset="1" stop-color="#b87550"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#fff0c8" stop-opacity=".95"/><stop offset=".3" stop-color="#f5c98d" stop-opacity=".45"/><stop offset="1" stop-color="#f5c98d" stop-opacity="0"/></radialGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65717b"/><stop offset="1" stop-color="#182536"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="885" cy="230" r="260" fill="url(#light)"/>

<!-- left typography -->
<rect x="48" y="48" width="680" height="530" rx="9" fill="#101827" opacity=".78"/>
<path d="M92 103H158" stroke="#e3bd8c" stroke-width="5"/>
<text x="92" y="145" fill="#e3bd8c" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">BIBLICAL CHRISTIAN</text>
<text x="88" y="276" fill="#fffaf1" font-family="Georgia,serif" font-size="76">What Is</text>
<text x="88" y="365" fill="#fffaf1" font-family="Georgia,serif" font-size="76">Saving Faith?</text>
<path d="M92 405H190" stroke="#e3bd8c" stroke-width="4"/>
<text x="92" y="456" fill="#e9ded2" font-family="Arial,sans-serif" font-size="22" letter-spacing="1.5">TRUSTING CHRIST, NOT OURSELVES.</text>
<text x="92" y="492" fill="#e9ded2" font-family="Arial,sans-serif" font-size="22" letter-spacing="1.5">A FAITH THAT BEARS FRUIT.</text>
<text x="92" y="540" fill="#e3bd8c" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">THE OBJECT OF TRUE FAITH IS JESUS</text>
</svg>
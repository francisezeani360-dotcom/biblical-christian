<circle cx="840" cy="370" r="24" fill="#111d2b"/>
<path d="M815 402Q840 385 865 402L882 486Q850 505 810 486Z" fill="#172333"/>
<path d="M820 480L805 560 830 560 846 490M855 485L875 555 899 548 877 470" fill="#101b29"/>

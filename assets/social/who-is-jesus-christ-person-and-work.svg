<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100f20"/><stop offset=".5" stop-color="#35202d"/><stop offset="1" stop-color="#8a4939"/></linearGradient>
 <radialGradient id="portal"><stop stop-color="#fff9e9"/><stop offset=".22" stop-color="#f8dba6" stop-opacity=".95"/><stop offset=".62" stop-color="#d78e5e" stop-opacity=".28"/><stop offset="1" stop-color="#d78e5e" stop-opacity="0"/></radialGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8e6a58"/><stop offset="1" stop-color="#211d2a"/></linearGradient>
 <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee0c8"/><stop offset="1" stop-color="#9e7a65"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
 <pattern id="stars" width="140" height="110" patternUnits="userSpaceOnUse"><circle cx="18" cy="20" r="1.4" fill="#fff1d8" opacity=".7"/><circle cx="88" cy="60" r="1" fill="#fff1d8" opacity=".55"/><circle cx="124" cy="12" r=".8" fill="#fff1d8" opacity=".65"/><circle cx="54" cy="94" r=".7" fill="#fff1d8" opacity=".45"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#night)"/>
<rect width="1200" height="630" fill="url(#stars)"/>
<!-- monumental doorway, a visual threshold between heaven and earth -->
<ellipse cx="845" cy="315" rx="320" ry="340" fill="url(#portal)" filter="url(#blur)"/>
<path d="M580 630V280Q580 60 850 38Q1120 60 1120 280V630Z" fill="url(#stone)" opacity=".88"/>
<path d="M635 630V282Q635 112 850 92Q1065 112 1065 282V630Z" fill="#171523"/>
<path d="M650 630V284Q650 130 850 111Q1050 130 1050 284V630Z" fill="url(#portal)"/>
<path d="M580 630V280Q580 60 850 38Q1120 60 1120 280V630" fill="none" stroke="#c49a71" stroke-width="9" opacity=".8"/>
<path d="M610 630V280Q610 85 850 66Q1090 85 1090 280V630" fill="none" stroke="#e3c39b" stroke-width="2" opacity=".45"/>
<!-- radiant light beyond the threshold -->
<path d="M850 125L1165 630H535Z" fill="#ffe8bd" opacity=".08"/>
<path d="M850 130L1020 630H680Z" fill="#fff4d8" opacity=".12"/>
<!-- reverent human silhouette, seen from behind, no facial depiction -->
<circle cx="850" cy="285" r="34" fill="#2a2025"/>
<path d="M811 321Q850 304 889 321L923 480Q946 535 985 630H715Q754 535 777 480Z" fill="url(#robe)"/>
<path d="M811 330Q850 359 889 330L876 500Q850 525 824 500Z" fill="#c5a98a" opacity=".5"/>
<path d="M811 342Q773 389 760 449M889 342Q927 389 940 449" fill="none" stroke="#e8d5b8" stroke-width="20" stroke-linecap="round"/>
<!-- foreground ground -->
<path d="M0 530Q180 495 360 530T700 520Q920 492 1200 530V630H0Z" fill="#0d101c"/>
<path d="M650 630Q770 560 850 535Q930 565 1050 630Z" fill="#b17c5c" opacity=".24"/>
<!-- left text panel -->
<path d="M0 0H570Q525 170 570 315T535 630H0Z" fill="#100f1d" opacity=".74"/>
<path d="M78 105h68" stroke="#e5bd8e" stroke-width="4" stroke-linecap="round"/>
<text x="78" y="145" fill="#e5bd8e" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">BIBLICAL CHRISTIAN</text>
<text x="72" y="255" fill="#fff8ed" font-family="Georgia,serif" font-size="78" font-weight="bold" letter-spacing="-2">Who Is</text>
<text x="72" y="345" fill="#fff8ed" font-family="Georgia,serif" font-size="78" font-weight="bold" letter-spacing="-2">Jesus</text>
<text x="72" y="435" fill="#e9bd8e" font-family="Georgia,serif" font-size="78" font-weight="bold" letter-spacing="-2">Christ?</text>
<path d="M80 470h88" stroke="#e5bd8e" stroke-width="4"/>
<text x="80" y="516" fill="#e9dfd4" font-family="Arial,sans-serif" font-size="18" letter-spacing="1.4">HIS PERSON. HIS WORK.</text>
<text x="80" y="547" fill="#e9dfd4" font-family="Arial,sans-serif" font-size="18" letter-spacing="1.4">THE SON OF GOD, OUR SAVIOUR.</text>
<g id="brand-watermark" transform="translate(902 544)"><rect width="278" height="72" rx="9" fill="#081522" fill-opacity=".88" stroke="#c7a66a" stroke-opacity=".92" stroke-width="1.5"/><g transform="translate(8 4) scale(.27)"><g fill="#f3eee3" font-family="Georgia,'Times New Roman',serif" font-weight="700"><text x="8" y="151" font-size="145" letter-spacing="-8">B</text><text x="137" y="151" font-size="145" letter-spacing="-7">C</text></g><path d="M119 18V157M91 58H147" fill="none" stroke="#c7a66a" stroke-width="12"/><path d="M14 166C48 147 83 153 119 173C155 153 190 147 224 166M14 179C49 160 84 166 119 186C154 166 189 160 224 179" fill="none" stroke="#f3eee3" stroke-width="6" stroke-linecap="round"/><path d="M119 173V190" stroke="#c7a66a" stroke-width="3"/><path d="M280 35H940M280 192H940" stroke="#c7a66a" stroke-width="2"/><text x="280" y="124" fill="#f3eee3" font-family="Georgia,serif" font-size="82" font-weight="700">BIBLICAL</text><text x="283" y="174" fill="#c7a66a" font-family="Georgia,serif" font-size="43" font-weight="700" letter-spacing="7.5">CHRISTIAN</text></g></g></svg>
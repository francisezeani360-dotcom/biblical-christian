<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">The work of Christ on the cross</title><desc id="desc">A cross at the centre connects four descriptions of Christ's saving work: substitution, redemption, reconciliation, and victory.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172b3a"/><stop offset="1" stop-color="#314b5d"/></linearGradient></defs><rect width="1000" height="420" rx="8" fill="url(#bg)"/><g fill="none" stroke="#c7a66a" stroke-opacity=".36"><circle cx="500" cy="210" r="145" stroke-width="2"/><circle cx="500" cy="210" r="180" stroke-dasharray="4 10"/></g><g stroke="#d8bd9b" stroke-width="18" stroke-linecap="round"><path d="M500 95V300M430 155H570"/></g><path d="M500 95V300M430 155H570" stroke="#fff7e8" stroke-width="6" stroke-linecap="round"/><g fill="#fff" font-family="Georgia,serif" text-anchor="middle"><text x="205" y="135" font-size="30">Substitution</text><text x="795" y="135" font-size="30">Redemption</text><text x="205" y="315" font-size="30">Reconciliation</text><text x="795" y="315" font-size="30">Victory</text></g><g fill="#d8bd9b" font-family="system-ui,sans-serif" text-anchor="middle" font-size="15"><text x="205" y="166">Christ in our place</text><text x="795" y="166">Freedom at a price</text><text x="205" y="346">Peace with God</text><text x="795" y="346">Death and evil defeated</text></g><g stroke="#c7a66a" stroke-width="2" stroke-opacity=".75"><path d="M310 145L390 185M690 145L610 185M310 300L390 240M690 300L610 240"/></g><text x="500" y="390" fill="#dbe3e8" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">ONE SAVING WORK · JESUS CHRIST CRUCIFIED AND RISEN</text></svg>
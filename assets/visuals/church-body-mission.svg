<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Christ the head of the church and its shared life</title><desc id="desc">Christ is shown above a gathered church. The congregation is connected to Scripture, worship, fellowship, service, and mission.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20394b"/><stop offset="1" stop-color="#101b2a"/></linearGradient><style>.label{font:600 22px Arial,sans-serif;fill:#f7f3eb}.small{font:17px Arial,sans-serif;fill:#d9e1e5}.line{stroke:#d7b77e;stroke-width:3;fill:none;opacity:.8}</style></defs><rect width="1000" height="570" rx="24" fill="url(#bg)"/><circle cx="500" cy="105" r="66" fill="#2c4b5e" stroke="#d7b77e" stroke-width="3"/><path d="M500 60v90M455 105h90" stroke="#e4c997" stroke-width="12" stroke-linecap="round"/><text x="500" y="205" text-anchor="middle" class="label">JESUS CHRIST</text><text x="500" y="232" text-anchor="middle" class="small">Head and Lord of the church</text><path class="line" d="M500 250V285M170 285H830M170 285V330M335 285V330M500 285V330M665 285V330M830 285V330"/><g><rect x="80" y="330" width="180" height="125" rx="15" fill="#2d4a5c" stroke="#d7b77e"/><text x="170" y="380" text-anchor="middle" class="label">SCRIPTURE</text><text x="170" y="412" text-anchor="middle" class="small">Word and truth</text></g><g><rect x="245" y="330" width="180" height="125" rx="15" fill="#2d4a5c" stroke="#d7b77e"/><text x="335" y="380" text-anchor="middle" class="label">WORSHIP</text><text x="335" y="412" text-anchor="middle" class="small">Prayer and praise</text></g><g><rect x="410" y="330" width="180" height="125" rx="15" fill="#2d4a5c" stroke="#d7b77e"/><text x="500" y="380" text-anchor="middle" class="label">FELLOWSHIP</text><text x="500" y="412" text-anchor="middle" class="small">Love and unity</text></g><g><rect x="575" y="330" width="180" height="125" rx="15" fill="#2d4a5c" stroke="#d7b77e"/><text x="665" y="380" text-anchor="middle" class="label">SERVICE</text><text x="665" y="412" text-anchor="middle" class="small">Care and gifts</text></g><g><rect x="740" y="330" width="180" height="125" rx="15" fill="#2d4a5c" stroke="#d7b77e"/><text x="830" y="380" text-anchor="middle" class="label">MISSION</text><text x="830" y="412" text-anchor="middle" class="small">Make disciples</text></g><text x="500" y="510" text-anchor="middle" class="label">ONE PEOPLE · UNDER ONE LORD · SENT WITH ONE GOSPEL</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">From creation to new creation</title><desc id="desc">Good creation, the fall, redemption through Christ, and the promised renewal of all things.</desc><rect width="1200" height="330" rx="18" fill="#172b3a"/><g fill="#f4eee4" font-family="Georgia,serif" text-anchor="middle" font-size="26"><text x="150" y="76">Creation</text><text x="450" y="76">The Fall</text><text x="750" y="76">Redemption</text><text x="1050" y="76">New Creation</text></g><g fill="none" stroke="#c9a879" stroke-width="4"><path d="M265 160h70m-12-12 12 12-12 12M565 160h70m-12-12 12 12-12 12M865 160h70m-12-12 12 12-12 12"/></g><g stroke="#d7c3a3" stroke-width="2"><circle cx="150" cy="160" r="48" fill="#5e806e"/><path d="M150 128v64m-23-38 23-26 23 26m-46 0 23 26 23-26"/><circle cx="450" cy="160" r="48" fill="#8d654d"/><path d="M425 140l50 40m0-40-50 40"/><circle cx="750" cy="160" r="48" fill="#a77b4e"/><path d="M750 123v74m-22-52h44"/><circle cx="1050" cy="160" r="48" fill="#6f8d86"/><path d="M1024 172q26-45 52 0m-52 0h52"/></g><g fill="#dbe3e8" font-family="system-ui,Arial,sans-serif" font-size="16" text-anchor="middle"><text x="150" y="247">God made it good</text><text x="450" y="247">Sin and death enter</text><text x="750" y="247">Christ bears sin and rises</text><text x="1050" y="247">Evil and death removed</text></g></svg>
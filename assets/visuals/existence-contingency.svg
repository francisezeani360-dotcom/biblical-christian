<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">The argument from contingency</title><desc id="desc">Created things are shown as dependent branches, resting on a foundation representing the necessary, self-existent Creator.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20384b"/><stop offset="1" stop-color="#111f2e"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4c995"/><stop offset="1" stop-color="#a77b4e"/></linearGradient></defs>
<rect width="960" height="430" rx="18" fill="url(#bg)"/>
<g fill="none" stroke="#d9c29b" stroke-opacity=".55" stroke-width="2"><path d="M480 106V156M210 156H750M210 156V198M390 156V198M570 156V198M750 156V198"/><path d="M210 258V293M390 258V293M570 258V293M750 258V293"/></g>
<g fill="#f7f4ed" stroke="#d8bd9b" stroke-width="1.5"><rect x="377" y="48" width="206" height="58" rx="10"/><rect x="132" y="198" width="156" height="60" rx="9"/><rect x="312" y="198" width="156" height="60" rx="9"/><rect x="492" y="198" width="156" height="60" rx="9"/><rect x="672" y="198" width="156" height="60" rx="9"/></g>
<g fill="#253746" font-family="Georgia,serif" text-anchor="middle"><text x="480" y="83" font-size="22">Dependent reality</text><text x="210" y="234" font-size="18">Life</text><text x="390" y="234" font-size="18">Matter</text><text x="570" y="234" font-size="18">Stars</text><text x="750" y="234" font-size="18">Human minds</text></g>
<path d="M480 293V326" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
<rect x="252" y="326" width="456" height="70" rx="12" fill="url(#gold)"/>
<text x="480" y="356" fill="#172b3a" font-family="Georgia,serif" font-size="24" text-anchor="middle">The necessary, self-existent Creator</text><text x="480" y="380" fill="#263746" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">The ultimate ground of all that depends on another</text>
<g fill="#d8bd9b" font-family="system-ui,sans-serif" font-size="13"><text x="480" y="25" text-anchor="middle" letter-spacing="2">WHY IS THERE ANYTHING AT ALL?</text><text x="480" y="418" text-anchor="middle" fill="#dbe3e8">A conceptual illustration of the contingency argument — not a scientific diagram</text></g>
</svg>
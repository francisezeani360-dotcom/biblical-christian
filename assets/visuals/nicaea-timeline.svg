<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Key events leading to and following the Council of Nicaea</title><desc id="desc">A historical timeline: persecution under Diocletian from 303, toleration measures in 313, the Council of Nicaea in 325, and the Council of Constantinople in 381.</desc><rect width="960" height="390" rx="24" fill="#172b3a"/><text x="480" y="43" fill="#d8bd9b" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">THE ROAD TO NICAEA AND THE TRINITARIAN CONFESSION</text><path d="M120 190H840" stroke="#c7a66a" stroke-width="4"/><g fill="#a77b4e" stroke="#f1e9d9" stroke-width="3"><circle cx="150" cy="190" r="13"/><circle cx="370" cy="190" r="13"/><circle cx="590" cy="190" r="13"/><circle cx="810" cy="190" r="13"/></g><g stroke="#c7a66a" stroke-width="2"><path d="M150 177V125M370 203V255M590 177V125M810 203V255"/></g><g fill="#fff" font-family="Arial,sans-serif" text-anchor="middle"><text x="150" y="91" font-size="25" font-weight="700">303</text><text x="150" y="113" font-size="14" fill="#d8bd9b">Persecution</text><text x="370" y="285" font-size="25" font-weight="700">313</text><text x="370" y="308" font-size="14" fill="#d8bd9b">Toleration measures</text><text x="590" y="91" font-size="25" font-weight="700">325</text><text x="590" y="113" font-size="14" fill="#d8bd9b">Council of Nicaea</text><text x="810" y="285" font-size="25" font-weight="700">381</text><text x="810" y="308" font-size="14" fill="#d8bd9b">Council of Constantinople</text></g><g fill="#d8bd9b" font-family="Arial,sans-serif" font-size="13" text-anchor="middle"><text x="150" y="145">Diocletian</text><text x="370" y="333">Constantine &amp; Licinius</text><text x="590" y="145">Arian controversy</text><text x="810" y="333">Further clarification</text></g><text x="480" y="365" fill="#d8bd9b" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">A simplified timeline · Dates refer to major imperial or council events</text></svg>
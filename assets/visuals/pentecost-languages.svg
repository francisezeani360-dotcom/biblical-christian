<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">The tongues at Pentecost</title><desc id="desc">A diagram showing the disciples proclaiming God's mighty works, visitors hearing in their own languages, and the gospel reaching people from many nations.</desc><rect width="960" height="420" rx="24" fill="#172b3a"/><circle cx="480" cy="185" r="118" fill="#263f50" stroke="#c7a66a" stroke-width="2"/><path d="M480 75c-32 48-32 172 0 220M480 75c32 48 32 172 0 220M365 185h230M390 120h180M390 250h180" fill="none" stroke="#d8bd9b" stroke-opacity=".45" stroke-width="2"/><circle cx="480" cy="185" r="13" fill="#d8bd9b"/><g fill="#fff" font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="32" font-size="22" font-weight="700">PENTECOST · ACTS 2</text><text x="480" y="168" font-size="16" font-weight="700">THE GOSPEL</text><text x="480" y="192" font-size="16" font-weight="700">PROCLAIMED</text><text x="480" y="215" font-size="12" fill="#d8bd9b">God's mighty works</text></g><g stroke="#c7a66a" stroke-width="2" fill="none"><path d="M362 150L220 105M355 220L220 300M598 150L740 105M605 220L740 300"/></g><g fill="#fff" font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="65" width="235" height="82" rx="12" fill="#263f50" stroke="#c7a66a"/><text x="172" y="98" font-size="17" font-weight="700">Many nations</text><text x="172" y="123" font-size="14" fill="#d8bd9b">Visitors gathered in Jerusalem</text><rect x="55" y="265" width="235" height="82" rx="12" fill="#263f50" stroke="#c7a66a"/><text x="172" y="298" font-size="17" font-weight="700">Recognisable speech</text><text x="172" y="323" font-size="14" fill="#d8bd9b">Their own native languages</text><rect x="670" y="65" width="235" height="82" rx="12" fill="#263f50" stroke="#c7a66a"/><text x="787" y="98" font-size="17" font-weight="700">They understood</text><text x="787" y="123" font-size="14" fill="#d8bd9b">Each heard in their language</text><rect x="670" y="265" width="235" height="82" rx="12" fill="#263f50" stroke="#c7a66a"/><text x="787" y="298" font-size="17" font-weight="700">One message</text><text x="787" y="323" font-size="14" fill="#d8bd9b">The mighty works of God</text></g></svg>
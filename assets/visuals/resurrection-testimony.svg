<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">The resurrection testimony in the New Testament</title><desc id="desc">The New Testament testimony moves from Jesus' death and burial to the empty tomb, appearances to witnesses, and the public proclamation of the risen Christ.</desc><rect width="960" height="380" rx="24" fill="#172b3a"/><text x="480" y="42" text-anchor="middle" fill="#d8bd9b" font-family="Arial,sans-serif" font-size="21" font-weight="700">THE NEW TESTAMENT RESURRECTION TESTIMONY</text><path d="M180 175H780" stroke="#c7a66a" stroke-width="4"/><g fill="#263f50" stroke="#d8bd9b" stroke-width="3"><circle cx="160" cy="175" r="63"/><circle cx="373" cy="175" r="63"/><circle cx="587" cy="175" r="63"/><circle cx="800" cy="175" r="63"/></g><g fill="#fff" font-family="Arial,sans-serif" text-anchor="middle"><text x="160" y="169" font-size="18" font-weight="700">DEATH</text><text x="160" y="193" font-size="14" fill="#d8bd9b">1 Cor. 15:3</text><text x="373" y="169" font-size="18" font-weight="700">BURIAL</text><text x="373" y="193" font-size="14" fill="#d8bd9b">1 Cor. 15:4</text><text x="587" y="169" font-size="18" font-weight="700">RAISED</text><text x="587" y="193" font-size="14" fill="#d8bd9b">1 Cor. 15:4</text><text x="800" y="169" font-size="18" font-weight="700">APPEARED</text><text x="800" y="193" font-size="14" fill="#d8bd9b">1 Cor. 15:5–8</text></g><g fill="#d8bd9b" font-family="Arial,sans-serif" text-anchor="middle" font-size="15"><text x="480" y="285">The apostolic message was publicly proclaimed and preserved in Scripture.</text><text x="480" y="317">See also Luke 24 · John 20–21 · Acts 2–4</text></g></svg>
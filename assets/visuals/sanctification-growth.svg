<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">The Christian's growth in holiness</title><desc id="desc">Union with Christ and the work of the Holy Spirit produce ongoing growth through the Word, prayer, fellowship, obedience, and the putting to death of sin. Growth is by grace and points toward Christlikeness.</desc><rect width="960" height="430" rx="24" fill="#172b3a"/><text x="480" y="42" fill="#d8bd9b" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="700">SANCTIFICATION · GROWING IN CHRISTLIKENESS</text><rect x="330" y="70" width="300" height="72" rx="13" fill="#a77b4e"/><text x="480" y="100" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">UNITED TO CHRIST</text><text x="480" y="123" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Accepted by grace · New life</text><path d="M480 142V180M160 180H800M160 180V210M373 180V210M587 180V210M800 180V210" fill="none" stroke="#d8bd9b" stroke-width="3"/><g fill="#263f50" stroke="#c7a66a" stroke-width="2"><rect x="65" y="210" width="190" height="86" rx="12"/><rect x="278" y="210" width="190" height="86" rx="12"/><rect x="492" y="210" width="190" height="86" rx="12"/><rect x="705" y="210" width="190" height="86" rx="12"/></g><g fill="#fff" font-family="Arial,sans-serif" text-anchor="middle"><text x="160" y="245" font-size="18" font-weight="700">THE WORD</text><text x="160" y="270" font-size="14" fill="#d8bd9b">Truth renews the mind</text><text x="373" y="245" font-size="18" font-weight="700">PRAYER</text><text x="373" y="270" font-size="14" fill="#d8bd9b">Dependence on God</text><text x="587" y="245" font-size="18" font-weight="700">THE CHURCH</text><text x="587" y="270" font-size="14" fill="#d8bd9b">Encouragement and care</text><text x="800" y="245" font-size="18" font-weight="700">OBEDIENCE</text><text x="800" y="270" font-size="14" fill="#d8bd9b">Putting sin to death</text></g><path d="M160 296V335H800V296M480 335V355" fill="none" stroke="#d8bd9b" stroke-width="3"/><rect x="330" y="355" width="300" height="52" rx="12" fill="#a77b4e"/><text x="480" y="387" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">GROWING IN HOLINESS</text></svg>
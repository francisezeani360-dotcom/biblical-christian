<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">The sovereignty and providence of God</title><desc id="desc">A central crown represents God's sovereign rule, connected to creation, providence, human responsibility, salvation, and final hope.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172b3a"/><stop offset="1" stop-color="#314b5d"/></linearGradient></defs><rect width="1000" height="420" rx="8" fill="url(#bg)"/><g fill="none" stroke="#c7a66a" stroke-opacity=".4"><circle cx="500" cy="210" r="145" stroke-width="2"/><circle cx="500" cy="210" r="180" stroke-dasharray="4 10"/></g><g stroke="#d8bd9b" stroke-width="4" fill="none" stroke-linejoin="round"><path d="M450 184L430 126L480 158L500 112L520 158L570 126L550 184Z"/><path d="M450 195H550L540 222H460Z"/><path d="M462 235H538"/></g><g fill="#fff" font-family="Georgia,serif" text-anchor="middle"><text x="205" y="115" font-size="29">Creation</text><text x="795" y="115" font-size="29">Providence</text><text x="205" y="322" font-size="29">Responsibility</text><text x="795" y="322" font-size="29">Salvation &amp; hope</text></g><g fill="#d8bd9b" font-family="system-ui,sans-serif" text-anchor="middle" font-size="15"><text x="205" y="145">All things belong to him</text><text x="795" y="145">All things sustained and ruled</text><text x="205" y="352">Our choices remain meaningful</text><text x="795" y="352">His purpose stands in Christ</text></g><g stroke="#c7a66a" stroke-width="2" stroke-opacity=".8"><path d="M310 130L390 185M690 130L610 185M310 315L390 240M690 315L610 240"/></g><text x="500" y="390" fill="#dbe3e8" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">THE LORD REIGNS · HOLY · WISE · GOOD</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">The Christian doctrine of the Trinity</title><desc id="desc">The Father is God, the Son is God, and the Holy Spirit is God. The Father is not the Son, the Son is not the Spirit, and the Spirit is not the Father.</desc><rect width="900" height="540" rx="24" fill="#172b3a"/><g stroke="#c7a66a" stroke-width="4" fill="none"><path d="M450 150L225 355M450 150L675 355M225 355H675"/></g><g fill="#263f50" stroke="#d8bd9b" stroke-width="3"><circle cx="450" cy="125" r="88"/><circle cx="225" cy="385" r="88"/><circle cx="675" cy="385" r="88"/></g><circle cx="450" cy="385" r="68" fill="#a77b4e" stroke="#d8bd9b" stroke-width="3"/><g fill="#fff" text-anchor="middle" font-family="Arial,sans-serif"><text x="450" y="118" font-size="24" font-weight="700">THE FATHER</text><text x="450" y="148" font-size="17">is God</text><text x="225" y="378" font-size="24" font-weight="700">THE SON</text><text x="225" y="408" font-size="17">is God</text><text x="675" y="378" font-size="24" font-weight="700">THE SPIRIT</text><text x="675" y="408" font-size="17">is God</text><text x="450" y="380" font-size="22" font-weight="700">ONE</text><text x="450" y="407" font-size="19">GOD</text><text x="450" y="35" font-size="21" fill="#d8bd9b" font-weight="700">ONE DIVINE BEING · THREE DISTINCT PERSONS</text></g><g fill="#d8bd9b" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="325" y="245">is not</text><text x="575" y="245">is not</text><text x="450" y="292">are not identical persons</text></g></svg>
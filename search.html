<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search the Library — Biblical Christian</title><link rel="stylesheet" href="/assets/site.css"></head><body><header class="site-head"><a class="brand" href="/">✦ Biblical Christian</a><nav><a href="/about.html">About</a><a href="/resources.html">Resources</a><a href="/contact.html">Contact</a></nav></header><main class="reading"><p class="eyebrow">Find a subject</p><h1>Search the library</h1><label class="search-label" for="q">Search articles, topics and passages</label><input id="q" class="search-box" type="search" placeholder="Try “salvation”, “Trinity” or “Romans 8”" autocomplete="off"><p id="status" class="muted" aria-live="polite">Search across the published library.</p><div id="results" class="results"></div></main><footer>Rooted in Scripture. Grounded in truth. · <a href="/contact.html">Contact</a></footer><script src="/assets/library.js"></script><script>const q=document.getElementById('q'),out=document.getElementById('results'),status=document.getElementById('status');function render(){const term=q.value.trim().toLowerCase();const hits=LIBRARY.filter(a=>!term||(a.title+' '+a.description+' '+a.tags+' '+a.passages).toLowerCase().includes(term));status.textContent=term?hits.length+' result'+(hits.length===1?'':'s')+' found':'Showing all '+hits.length+' published resources';out.innerHTML=hits.map(a=>'<a class="result" href="'+a.url+'"><span class="eyebrow">'+a.category+'</span><h2>'+a.title+'</h2><p>'+a.description+'</p></a>').join('')||'<p class="empty">No matching resources yet. Try another word or browse the categories.</p>'}q.addEventListener('input',render);render();</script></body></html>
